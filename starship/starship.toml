# Scarlet Protocol inspired prompt for Fish/WezTerm.
palette = "scarlet_protocol"
add_newline = true
command_timeout = 1000

format = "$username$hostname$directory$git_branch$git_status$cmd_duration$character"

right_format = "$status$time"

[palettes.scarlet_protocol]
background = "#1c153d"
foreground = "#c7c7c7"
scarlet = "#ff0051"
green = "#00dc84"
yellow = "#faf945"
blue = "#6871ff"
purple = "#ca30c7"
cyan = "#00c5c7"
dim_purple = "#686868"

[username]
show_always = true
style_user = "bold scarlet"
style_root = "bold yellow"
format = "[$user]($style)"

[hostname]
ssh_only = true
style = "bold cyan"
format = "[@$hostname]($style) "

[directory]
style = "bold blue"
read_only = " ro"
read_only_style = "bold scarlet"
truncation_length = 4
truncate_to_repo = true
format = "[in](dim_purple) [$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = "git:"
style = "bold purple"
format = "[on](dim_purple) [$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "!${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "s${count}"
modified = "~${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "x${count}"

[cmd_duration]
min_time = 1500
show_milliseconds = false
style = "bold cyan"
format = "[took](dim_purple) [$duration]($style) "

[status]
disabled = false
style = "bold scarlet"
format = "[$symbol$status]($style) "
symbol = "exit:"

[time]
disabled = false
time_format = "%H:%M"
style = "dim_purple"
format = "[$time]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold scarlet)"
vimcmd_symbol = "[❮](bold yellow)"
