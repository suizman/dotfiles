# Enable mouse support for selecting panes, switching windows, and resizing.
set -g mouse on
set -g default-terminal "tmux-256color"

# Resize bindings
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

unbind r

bind -r m resize-pane -Z

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

bind r source-file ~/.tmux.conf 
# Catppuccin theme, installed and managed by TPM.
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'slanted'

# Other plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Give the theme something to render in the status line.
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ''
set -g status-right '#{E:@catppuccin_status_application}'
set -agF status-right '#{E:@catppuccin_status_session}'
set -agF status-right '#{E:@catppuccin_status_uptime}'

# Keep TPM's default location explicit so command-line installation also works
# when a tmux server was started before this configuration was installed.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

# Initialize TPM. Keep this at the bottom of the file.
run '~/.tmux/plugins/tpm/tpm'
